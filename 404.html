<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-Y4zd3U4KYOxkQw5uGvqt6ye5uWWt6JdsVBV1LjzWxIQ=' 'sha256-T8WE4Hli5VHVTZ3AOdWFuPNergey1LcU27m7QCv2b9Y='; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found – MAI Grades</title>
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('mai-grades:theme') || 'system'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <style>
    :root { color-scheme: light; --bg: #f5f5f7; --ink: #1d1d1f; --ink-2: #6e6e73; --track: rgba(0,0,0,.07); --c: #2a78d6; --solid: #fff; --focus: #0071e3; }
    :root[data-theme='dark'] { color-scheme: dark; --bg: #000; --ink: #f5f5f7; --ink-2: #a1a1a6; --track: rgba(255,255,255,.12); --c: #3987e5; --solid: #1c1c1e; --focus: #2997ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink);
      -webkit-font-smoothing: antialiased; }
    main { width: min(560px, 100%); }
    .num { font-size: clamp(88px, 22vw, 156px); font-weight: 650; letter-spacing: -0.06em; line-height: 1; font-variant-numeric: tabular-nums; margin: 0; }
    h1 { font-size: clamp(26px, 5vw, 34px); letter-spacing: -0.03em; margin: 18px 0 8px; text-wrap: balance; }
    p { color: var(--ink-2); font-size: 18px; line-height: 1.45; margin: 0; text-wrap: pretty; }
    .track { position: relative; height: 14px; margin: 34px 0 10px; border-radius: 999px; background: var(--track); }
    .fill { position: absolute; inset: 0 auto 0 0; width: 40.4%; border-radius: 999px; background: color-mix(in oklab, var(--c) 30%, transparent); }
    .pass { position: absolute; left: 50%; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink-2); border-radius: 2px; }
    .dot { position: absolute; top: 50%; left: 40.4%; width: 24px; height: 24px; transform: translate(-50%, -50%);
      border-radius: 50%; border: 3px solid var(--c); background: var(--solid); box-shadow: 0 0 0 2px var(--solid);
      animation: search 2.8s cubic-bezier(.45,0,.2,1) infinite; }
    @keyframes search { 0%, 100% { left: 40.4%; } 30% { left: 62%; } 60% { left: 18%; } }
    .ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    a { display: inline-flex; align-items: center; gap: 8px; margin-top: 30px; min-height: 48px; padding: 0 22px; border-radius: 999px;
      background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; transition: transform .15s; }
    a:active { transform: scale(.97); }
    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main>
    <p class="num" aria-hidden="true">4.04</p>
    <div class="track" aria-hidden="true"><span class="fill"></span><span class="pass"></span><span class="dot"></span></div>
    <div class="ticks" aria-hidden="true"><span>0</span><span>5</span><span>10</span></div>
    <h1>This page isn't on the syllabus</h1>
    <p>The address may be mistyped, or the page has moved. Your grades are safe on this device.</p>
    <a id="home" href="./">Back to your subjects</a>
  </main>
  <script>
    // GitHub Pages serves this file for any unknown path; send people to the app root of this site.
    var parts = location.pathname.split('/').filter(Boolean);
    if (location.hostname.endsWith('github.io') && parts.length) document.getElementById('home').href = '/' + parts[0] + '/';
  </script>
</body>
</html>
